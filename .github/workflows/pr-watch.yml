name: pr-watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: pr-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # State = last handled mention per PR. Cache entries are immutable, so each run saves a new
      # key and the next one restores the newest by prefix.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: pr-watch-state-${{ github.run_id }}
          restore-keys: pr-watch-state-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code

      - name: Scan PRs
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 pr_watch.py --once
