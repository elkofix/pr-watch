name: pr-watch

on:
  # Triggered every 30 min by cron-job.org through the workflow_dispatch API (GitHub cron never fired).
  workflow_dispatch:
    inputs:
      only:
        description: "One-off review of a single PR, ignoring state (e.g. contratacion-front#33)"
        required: false
        default: ""
      action:
        description: "review (default) or merge (the PR reached its required approvals)"
        required: false
        default: "review"
      comment_id:
        description: "Comment that asked for the review (set by the Lambda)"
        required: false
        default: ""
      unchanged:
        description: "merge action: 'true' when no commit was pushed since the agent reviewed the PR"
        required: false
        default: ""

concurrency:
  group: pr-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # State = last handled mention per PR. Cache entries are immutable, so each run saves a new
      # key and the next one restores the newest by prefix.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: pr-watch-state-${{ github.run_id }}
          restore-keys: pr-watch-state-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan PRs
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY: ${{ inputs.only }}
          ACTION: ${{ inputs.action }}
          COMMENT_ID: ${{ inputs.comment_id }}
          UNCHANGED: ${{ inputs.unchanged }}
          LANG: C.UTF-8
          PYTHONUTF8: "1"
        run: python3 pr_watch.py --once
